name: Release

# Push a version tag to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Tags with a suffix (v0.2.0-rc1) become pre-releases.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build all platforms
        # The checkout has no tags, so pass the version explicitly.
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - name: Check the binaries report the tag
        run: |
          got="$(./dist/hankopod-linux-amd64 --version)"
          echo "$got"
          [ "$got" = "hankopod ${GITHUB_REF_NAME}" ]

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "hankopod ${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease}
